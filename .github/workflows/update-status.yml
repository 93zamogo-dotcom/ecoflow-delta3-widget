name: Update EcoFlow status

on:
  schedule:
    # every 15 minutes — free for public repos
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r bridge/requirements.txt

      - name: Fetch EcoFlow status
        env:
          ECOFLOW_EMAIL: ${{ secrets.ECOFLOW_EMAIL }}
          ECOFLOW_PASSWORD: ${{ secrets.ECOFLOW_PASSWORD }}
          ECOFLOW_SN: ${{ secrets.ECOFLOW_SN }}
          ECOFLOW_REGION: ${{ secrets.ECOFLOW_REGION }}
        run: |
          set -euo pipefail
          cd bridge
          python fetch_once.py | tee ../status.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("../status.json").read_text())
          # keep widget payload only (no huge raw dump)
          public = {k: v for k, v in data.items() if k != "raw"}
          Path("../status.json").write_text(json.dumps(public, ensure_ascii=False, indent=2) + "\n")
          print("soc=", public.get("soc"), "online=", public.get("online"))
          PY

      - name: Commit status.json
        run: |
          git config user.name "ecoflow-bot"
          git config user.email "ecoflow-bot@users.noreply.github.com"
          git add status.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update EcoFlow status"
            git push
          fi
