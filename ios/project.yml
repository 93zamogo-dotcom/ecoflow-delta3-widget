name: EcoFlowDelta
options:
  bundleIdPrefix: com.oleksandr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  EcoFlowDelta:
    type: application
    platform: iOS
    sources:
      - EcoFlowDelta
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oleksandr.ecoflowdelta
        INFOPLIST_KEY_CFBundleDisplayName: EcoFlow Delta
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: EcoFlowDeltaWidget
    info:
      path: EcoFlowDelta/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: EcoFlowDelta/EcoFlowDelta.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.oleksandr.ecoflowdelta
  EcoFlowDeltaWidget:
    type: app-extension
    platform: iOS
    sources:
      - EcoFlowDeltaWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oleksandr.ecoflowdelta.widget
        DEVELOPMENT_TEAM: ""
    info:
      path: EcoFlowDeltaWidget/Info.plist
      properties:
        CFBundleDisplayName: EcoFlow Delta Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EcoFlowDeltaWidget/EcoFlowDeltaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.oleksandr.ecoflowdelta
schemes:
  EcoFlowDelta:
    build:
      targets:
        EcoFlowDelta: all
        EcoFlowDeltaWidget: all
